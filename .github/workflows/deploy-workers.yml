# Deploys the Rendezvous and Relay Cloudflare Workers directly from
# totaldrop-servers/main once CI checks succeed and the protected `cloudflare`
# environment approves the deployment.
name: Deploy Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - cloudflare-rendezvous/**
      - cloudflare-relay/**
      - rust-shared/tools/probe.mjs
  workflow_dispatch:
    inputs:
      target:
        description: Worker target to deploy from main
        type: choice
        required: true
        options: [rendezvous, relay, both]

permissions:
  contents: read

jobs:
  targets:
    name: Select Worker targets
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          CHOSEN: ${{ inputs.target }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            case $CHOSEN in
              rendezvous) list='["rendezvous"]' ;;
              relay) list='["relay"]' ;;
              both) list='["rendezvous","relay"]' ;;
            esac
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git -c core.quotePath=false diff --no-renames --name-only "$BEFORE" "$GITHUB_SHA")
            list=$(printf '%s\n' "$files" | awk '
              /^cloudflare-rendezvous\//          { t["rendezvous"] = 1 }
              /^cloudflare-relay\//               { t["relay"] = 1 }
              /^rust-shared\/tools\/probe\.mjs$/  { t["rendezvous"] = t["relay"] = 1 }
              END { s = ""; for (k in t) s = s (s ? "," : "") "\"" k "\""; print "[" s "]" }')
          else
            list='["rendezvous","relay"]'
          fi
          echo "targets: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify Workers before deploy
    needs: targets
    if: needs.targets.outputs.list != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Check and test cloudflare-rendezvous
        working-directory: cloudflare-rendezvous
        run: npm ci --ignore-scripts && npm run check && npm test
      - name: Check and test cloudflare-relay
        working-directory: cloudflare-relay
        run: npm ci --ignore-scripts && npm run check && npm test
      - name: Verify health probe syntax
        run: node --check rust-shared/tools/probe.mjs

  deploy:
    name: Deploy ${{ matrix.target }} Worker
    needs: [targets, verify]
    if: >-
      needs.verify.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    concurrency:
      group: deploy-worker-${{ matrix.target }}
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install locked Wrangler
        run: npm ci --ignore-scripts --prefix "cloudflare-${{ matrix.target }}"
      - name: Deploy Worker
        working-directory: cloudflare-${{ matrix.target }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --message "$GITHUB_SHA"
      - name: Post-deploy health probe
        run: node rust-shared/tools/probe.mjs "${{ matrix.target }}"
