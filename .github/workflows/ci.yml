# Continuous integration for TotalDrop Servers: Cloudflare Workers type-check
# and unit tests, native x86_64 and ARM64 Linux Rust server verification and
# binary builds, dependency audit, REUSE 3.3 license compliance, and secret
# scanning. The final "CI" gate job is the single required status check.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  workers:
    name: Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install, check, and test cloudflare-rendezvous
        working-directory: cloudflare-rendezvous
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
      - name: Install, check, and test cloudflare-relay
        working-directory: cloudflare-relay
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
      - name: Verify deploy health probe syntax
        run: node --check rust-shared/tools/probe.mjs

  rust-servers:
    name: Rust servers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Build native x86_64 Linux binaries
        if: runner.arch == 'X64'
        run: ./target-linux-x86_64/build.sh --gnu
      - name: Build native ARM64 Linux binaries
        if: runner.arch == 'ARM64'
        run: ./target-linux-arm64/build.sh --gnu

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.99.1"

  reuse:
    name: Licenses (REUSE)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Source files carry SPDX lines
        run: ./tools/check-spdx.sh
      - name: reuse lint
        run: >-
          docker run --rm --volume "$PWD:/data"
          fsfe/reuse:6.2.0@sha256:85462a75c0f8efda09ddd190b92816b70e7662577c8427429e11e1b9f25a992e
          lint

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Commits to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case $EVENT in
            pull_request) base=HEAD^1 ;;
            push) base=$BEFORE ;;
            merge_group) base=$MERGE_GROUP_BASE ;;
            *) base= ;;
          esac
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            range=$base..HEAD
          else
            base=HEAD range=HEAD
          fi
          echo "Scanning $range"
          { echo "BASE=$base"; echo "RANGE=$range"; } >>"$GITHUB_ENV"
      - name: No signing keys, key.properties, or .gitleaksignore
        run: |
          found=$(
            { git ls-files -z
              git -c core.quotePath=false log --format= --name-only -z --no-renames --diff-filter=d "$RANGE"
            } | grep -ziE '(^|/)(key\.properties|\.gitleaksignore)$|\.(jks|keystore|p12|pfx|pepk)$' | tr '\0' '\n' | sort -u
          )
          if [ -n "$found" ]; then
            printf '%s\n' "$found"
            echo "::error::Signing keys, key.properties, and .gitleaksignore must not be committed."
            exit 1
          fi
      - name: gitleaks
        if: ${{ !cancelled() && steps.range.outcome == 'success' }}
        run: |
          cfg=$RUNNER_TEMP/gitleaks
          mkdir -p "$cfg"
          if ! git show "$BASE:.gitleaks.toml" >"$cfg/gitleaks.toml" 2>/dev/null; then
            printf '[extend]\nuseDefault = true\n' >"$cfg/gitleaks.toml"
          fi
          docker run --rm --volume "$PWD/.git:/repo/.git:ro" --volume "$cfg:/cfg:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            git --no-banner --redact --verbose --config /cfg/gitleaks.toml \
            --gitleaks-ignore-path /cfg --ignore-gitleaks-allow \
            --log-opts="--text $RANGE" /repo

  gate:
    name: CI
    if: always()
    needs: [workers, rust-servers, deny, reuse, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null
