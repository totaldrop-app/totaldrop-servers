# cargo-deny: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# No advisory is ignored. An ignore requires a documented rationale and a
# clear condition for removal.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    # subtle: permissive, AGPL compatible.
    "BSD-3-Clause",
    # ring, untrusted: permissive, AGPL compatible.
    "ISC",
]
# Add a license here only after checking compatibility with every workspace
# crate license, and explain why in the pull request.
exceptions = [
    { allow = ["AGPL-3.0-or-later"], crate = "totaldrop-rendezvous" },
    { allow = ["AGPL-3.0-or-later"], crate = "totaldrop-relay" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
