[workspace]
resolver = "3"
members = [
    "crates/totaldrop-proto",
    "rust-shared/totaldrop-rendezvous",
    "rust-shared/totaldrop-relay",
]

[workspace.package]
version = "0.2.0-beta.5"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/totaldrop-app/totaldrop-servers"
homepage = "https://totaldrop.app"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
